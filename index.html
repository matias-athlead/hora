<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Soporte para modo Pantalla Completa en iOS (Safari) al añadir a inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reloj Estilo iOS</title>
    
    <!-- Fuente Nunito para lograr el peso ultra grueso y bordes redondeados -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            background-color: #000;
            color: #fff;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Indicador de Batería */
        .battery-container {
            position: absolute;
            top: clamp(20px, 5vh, 40px);
            right: clamp(20px, 5vw, 40px);
            width: clamp(42px, 7vw, 70px);
            height: clamp(42px, 7vw, 70px);
            border-radius: 50%;
            border: clamp(3px, 0.7vw, 7px) solid #30d158;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .battery-icon {
            width: 50%;
            height: 50%;
            fill: #30d158;
        }

        .battery-text {
            font-size: clamp(11px, 1.5vw, 18px);
            font-weight: 900;
            color: #30d158;
        }

        /* Contenedor del Reloj */
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 95vw;
            height: 80vh;
        }

        .time-group {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(90px, 32vw, 420px);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.05em;
        }

        /* Horas en Azul Oscuro */
        .hours {
            color: #0066cc;
            -webkit-text-stroke: 1.2vw #0066cc;
            paint-order: stroke fill;
            margin-right: -0.05em;
        }

        /* Puntos Separadores */
        .dots {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 4.5vw, 60px);
            margin: 0 clamp(4px, 1.5vw, 25px);
            z-index: 5;
        }

        .dot {
            width: clamp(16px, 4.5vw, 60px);
            height: clamp(16px, 4.5vw, 60px);
            background-color: #d0d5dd;
            border-radius: 50%;
        }

        /* Minutos en Azul Claro */
        .minutes {
            color: #4da6ff;
            opacity: 0.92;
            -webkit-text-stroke: 1.2vw #4da6ff;
            paint-order: stroke fill;
            margin-left: -0.05em;
            mix-blend-mode: screen;
        }

        /* Botón de Pantalla Completa táctil */
        .fullscreen-btn {
            position: absolute;
            bottom: clamp(20px, 4vh, 40px);
            right: clamp(20px, 4vw, 40px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: clamp(12px, 3.5vw, 16px);
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .fullscreen-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>

    <!-- Indicador de Batería -->
    <div class="battery-container" id="batteryContainer">
        <svg class="battery-icon" id="lightningIcon" viewBox="0 0 24 24">
            <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
        </svg>
        <span class="battery-text" id="batteryText" style="display: none;">--</span>
    </div>

    <!-- Contenedor del Reloj -->
    <div class="clock-container" id="clock">
        <div class="time-group hours" id="hours">00</div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="time-group minutes" id="minutes">00</div>
    </div>

    <!-- Botón Pantalla Completa -->
    <button class="fullscreen-btn" id="fsBtn">Pantalla completa</button>

    <script>
        // Actualización de la Hora
        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hrs;
            document.getElementById('minutes').textContent = mins;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // API de Batería
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryUI() {
                    const icon = document.getElementById('lightningIcon');
                    const text = document.getElementById('batteryText');

                    if (battery.charging) {
                        icon.style.display = 'block';
                        text.style.display = 'none';
                    } else {
                        icon.style.display = 'none';
                        text.style.display = 'inline';
                        text.textContent = Math.round(battery.level * 100) + '%';
                    }
                }

                updateBatteryUI();
                battery.addEventListener('chargingchange', updateBatteryUI);
                battery.addEventListener('levelchange', updateBatteryUI);
            });
        }

        // Lógica universal de Pantalla Completa (Móvil y Escritorio)
        const fsBtn = document.getElementById('fsBtn');

        function toggleFullscreen() {
            const doc = document.documentElement;
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFS) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(() => {});
                } else if (doc.webkitRequestFullscreen) { /* Safari / iOS / Android Antiguos */
                    doc.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        // Eventos táctiles para dispositivos móviles
        fsBtn.addEventListener('click', toggleFullscreen);
        fsBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            toggleFullscreen();
        });

        // Doble toque en cualquier parte de la pantalla para entrar/salir
        let lastTap = 0;
        document.body.addEventListener('touchend', function (e) {
            if (e.target === fsBtn) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                toggleFullscreen();
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        // Ocultar o mostrar el botón según si está en pantalla completa
        function handleFSChange() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            fsBtn.style.opacity = isFS ? '0' : '1';
            fsBtn.style.pointerEvents = isFS ? 'none' : 'auto';
        }

        document.addEventListener('fullscreenchange', handleFSChange);
        document.addEventListener('webkitfullscreenchange', handleFSChange);
    </script>
</body>
</html>
