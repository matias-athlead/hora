<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permite pantalla completa nativa al añadir a inicio en iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reloj Estilo iOS</title>
    
    <!-- Fuente Nunito para el peso ultra grueso y bordes redondeados -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            background-color: #000;
            color: #fff;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Indicador de Batería Circular (Porcentaje Real) */
        .battery-container {
            position: absolute;
            top: clamp(20px, 5vh, 40px);
            right: clamp(20px, 5vw, 40px);
            width: clamp(45px, 7.5vw, 75px);
            height: clamp(45px, 7.5vw, 75px);
            border-radius: 50%;
            border: clamp(3px, 0.7vw, 7px) solid #30d158;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .battery-text {
            font-size: clamp(11px, 1.6vw, 19px);
            font-weight: 900;
            color: #30d158;
            letter-spacing: -0.5px;
        }

        /* Contenedor del Reloj */
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 95vw;
            height: 80vh;
        }

        .time-group {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(90px, 32vw, 420px);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.05em;
        }

        /* Horas en Azul Oscuro */
        .hours {
            color: #0066cc;
            -webkit-text-stroke: 1.2vw #0066cc;
            paint-order: stroke fill;
            margin-right: -0.05em;
        }

        /* Puntos Separadores */
        .dots {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 4.5vw, 60px);
            margin: 0 clamp(4px, 1.5vw, 25px);
            z-index: 5;
        }

        .dot {
            width: clamp(16px, 4.5vw, 60px);
            height: clamp(16px, 4.5vw, 60px);
            background-color: #d0d5dd;
            border-radius: 50%;
        }

        /* Minutos en Azul Claro con Superposición Traslúcida */
        .minutes {
            color: #4da6ff;
            opacity: 0.92;
            -webkit-text-stroke: 1.2vw #4da6ff;
            paint-order: stroke fill;
            margin-left: -0.05em;
            mix-blend-mode: screen;
        }

        /* Capa transparente global para capturar el toque en móviles */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 15;
            cursor: pointer;
        }

        /* Botón de Pantalla Completa (se oculta al activarse) */
        .fullscreen-btn {
            position: absolute;
            bottom: clamp(20px, 4vh, 40px);
            right: clamp(20px, 4vw, 40px);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: clamp(13px, 3.5vw, 16px);
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Ocultar el botón y la capa cuando la pantalla está completa */
        .is-fullscreen .fullscreen-btn,
        .is-fullscreen .fullscreen-overlay {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- Capa que activa la pantalla completa al tocar cualquier lado -->
    <div class="fullscreen-overlay" id="overlay"></div>

    <!-- Indicador de Batería Circular -->
    <div class="battery-container" id="batteryContainer">
        <span class="battery-text" id="batteryText">--%</span>
    </div>

    <!-- Contenedor del Reloj -->
    <div class="clock-container" id="clock">
        <div class="time-group hours" id="hours">00</div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="time-group minutes" id="minutes">00</div>
    </div>

    <!-- Botón Pantalla Completa -->
    <button class="fullscreen-btn" id="fsBtn">Pantalla completa</button>

    <script>
        // Actualización de la Hora
        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hrs;
            document.getElementById('minutes').textContent = mins;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // API de Batería Real
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryUI() {
                    const text = document.getElementById('batteryText');
                    text.textContent = Math.round(battery.level * 100) + '%';
                }

                updateBatteryUI();
                battery.addEventListener('levelchange', updateBatteryUI);
            });
        }

        // Función para activar Pantalla Completa
        function requestFS() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen().catch(() => {});
            } else if (doc.webkitRequestFullscreen) { /* Compatibilidad Safari / iOS */
                doc.webkitRequestFullscreen();
            } else if (doc.msRequestFullscreen) {
                doc.msRequestFullscreen();
            }
        }

        // Eventos táctiles y clics para entrar en pantalla completa
        const fsBtn = document.getElementById('fsBtn');
        const overlay = document.getElementById('overlay');

        [fsBtn, overlay].forEach(el => {
            el.addEventListener('click', requestFS);
            el.addEventListener('touchstart', function(e) {
                e.preventDefault();
                requestFS();
            }, { passive: false });
        });

        // Detectar si está en pantalla completa para ocultar botón y capa
        function checkFullscreenStatus() {
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            
            if (isFS) {
                document.body.classList.add('is-fullscreen');
            } else {
                document.body.classList.remove('is-fullscreen');
            }
        }

        document.addEventListener('fullscreenchange', checkFullscreenStatus);
        document.addEventListener('webkitfullscreenchange', checkFullscreenStatus);
    </script>
</body>
</html>
