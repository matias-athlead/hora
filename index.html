<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Estilo iOS</title>
    <!-- Fuente Nunito para lograr el peso ultra grueso y bordes redondeados -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Indicador de Batería */
        .battery-container {
            position: absolute;
            top: 5vh;
            right: 5vw;
            width: clamp(40px, 6vw, 70px);
            height: clamp(40px, 6vw, 70px);
            border-radius: 50%;
            border: clamp(3px, 0.6vw, 7px) solid #30d158;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .battery-icon {
            width: 50%;
            height: 50%;
            fill: #30d158;
        }

        .battery-text {
            font-size: clamp(10px, 1.4vw, 18px);
            font-weight: 900;
            color: #30d158;
        }

        /* Contenedor del Reloj */
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 90vw;
            height: 80vh;
        }

        .time-group {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(100px, 32vw, 420px);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.05em;
        }

        /* Horas en Azul Oscuro */
        .hours {
            color: #0066cc;
            -webkit-text-stroke: 1.2vw #0066cc;
            paint-order: stroke fill;
            margin-right: -0.05em;
        }

        /* Puntos Separadores */
        .dots {
            display: flex;
            flex-direction: column;
            gap: clamp(15px, 4.5vw, 60px);
            margin: 0 clamp(5px, 1.5vw, 25px);
            z-index: 5;
        }

        .dot {
            width: clamp(18px, 4.5vw, 60px);
            height: clamp(18px, 4.5vw, 60px);
            background-color: #d0d5dd;
            border-radius: 50%;
        }

        /* Minutos en Azul Claro con Superposición Traslúcida */
        .minutes {
            color: #4da6ff;
            opacity: 0.92;
            -webkit-text-stroke: 1.2vw #4da6ff;
            paint-order: stroke fill;
            margin-left: -0.05em;
            mix-blend-mode: screen;
        }

        /* Botón de Pantalla Completa */
        .fullscreen-btn {
            position: absolute;
            bottom: 4vh;
            right: 4vw;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8e8e93;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Indicador de Batería Superior Derecho -->
    <div class="battery-container" id="batteryContainer">
        <!-- Rayo de Carga -->
        <svg class="battery-icon" id="lightningIcon" viewBox="0 0 24 24">
            <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
        </svg>
        <!-- Porcentaje (oculto por defecto) -->
        <span class="battery-text" id="batteryText" style="display: none;">--</span>
    </div>

    <!-- Contenedor del Reloj -->
    <div class="clock-container" id="clock">
        <div class="time-group hours" id="hours">00</div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="time-group minutes" id="minutes">00</div>
    </div>

    <!-- Botón Pantalla Completa -->
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullscreen()">Pantalla completa</button>

    <script>
        // Actualización de la Hora
        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hrs;
            document.getElementById('minutes').textContent = mins;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // API de Batería
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryUI() {
                    const icon = document.getElementById('lightningIcon');
                    const text = document.getElementById('batteryText');

                    if (battery.charging) {
                        icon.style.display = 'block';
                        text.style.display = 'none';
                    } else {
                        icon.style.display = 'none';
                        text.style.display = 'inline';
                        text.textContent = Math.round(battery.level * 100) + '%';
                    }
                }

                updateBatteryUI();
                battery.addEventListener('chargingchange', updateBatteryUI);
                battery.addEventListener('levelchange', updateBatteryUI);
            });
        }

        // Modo Pantalla Completa
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Ocultar el botón si entra a pantalla completa
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fsBtn');
            if (document.fullscreenElement) {
                btn.style.opacity = '0';
            } else {
                btn.style.opacity = '1';
            }
        });

        // Permitir también doble clic en la pantalla para pantalla completa
        document.body.addEventListener('dblclick', toggleFullscreen);
    </script>
</body>
</html>
